name: Publicar posts agendados do blog

# Roda todo dia de madrugada (03:00 BRT). O GitHub atrasa cron de repositório
# com pouco movimento em ate 3-5 horas (visto nos logs: agendado pras 8h,
# rodava entre 10h48 e 13h43), entao o horario cedo garante que o post esteja
# no ar antes das 8h. O publicar.js nao faz nada nos dias sem post agendado,
# entao rodar diariamente e seguro. Pra publicar na hora exata: gh workflow run publicar-blog.yml
#
# 10/10/2026: mesmo assim rodava entre 9h15 e 9h25. Agora sao 3 horarios
# (minutos quebrados, que o GitHub atrasa menos que hora cheia). O primeiro que
# rodar publica; os outros nao acham nada vencido e so conferem o push.
on:
  schedule:
    - cron: "17 3 * * *"   # 00:17 BRT
    - cron: "0 6 * * *"    # 03:00 BRT
    - cron: "43 8 * * *"   # 05:43 BRT
  workflow_dispatch: {}

# Nunca duas rodadas ao mesmo tempo (evita publicar em dobro ou push em conflito).
concurrency:
  group: publicar-blog
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Rodar publicar.js
        run: node publicar.js --aplicar

      - name: Commit e push se algo foi publicado
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "post: publicacao automatica agendada"
            git push
          else
            echo "Nada com data para hoje. Nada a publicar."
            # Verifica que o push funcionaria, sem escrever nada. Assim uma
            # quebra de permissao aparece aqui antes do dia da publicacao,
            # em vez de silenciosamente nao publicar o post.
            echo "Verificando se o push estaria funcionando (dry-run)..."
            git push --dry-run
            echo "OK: credencial de push valida."
          fi
